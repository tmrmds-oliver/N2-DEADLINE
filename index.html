<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N2 副詞地獄特訓 (3倍題庫版)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c; /* 改為更警示的紅色 */
            --correct: #27ae60;
            --wrong: #c0392b;
            --bg: #f5f6fa;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
        }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .question-area { margin-bottom: 25px; }
        .sentence {
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--accent);
            min-height: 80px;
            display: flex;
            align-items: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .option-btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover { background: #f0f0f0; border-color: var(--primary); }
        .option-btn.correct { background: #d5f5e3; border-color: var(--correct); color: var(--correct); font-weight: bold; }
        .option-btn.wrong { background: #fadbd8; border-color: var(--wrong); color: var(--wrong); opacity: 0.7; }
        
        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fdfefe;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
        }
        .explanation-box.show { display: block; animation: fadeIn 0.5s; }
        .exp-title { font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .exp-translation { margin-bottom: 15px; font-weight: bold; color: #34495e; }
        .exp-detail { font-size: 0.95rem; line-height: 1.6; color: #555; }
        .next-btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .next-btn:hover { background: #34495e; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Start & End Screen */
        #start-screen, #end-screen { text-align: center; padding: 40px 0; }
        .big-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
            margin-top: 20px;
            font-weight: bold;
        }
        .big-btn:active { transform: translateY(4px); box-shadow: none; }
        .badge { display: inline-block; background: #3498db; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>JLPT N2 副詞・擬聲擬態詞<br>究極強化版</h1>
        <p>題庫包含：一般副詞、複合詞、擬聲擬態詞。</p>
        <p><strong>強化機制：</strong>每個單字有 3 個不同例句隨機出現，徹底防止死記硬背。</p>
        <p>答錯的題目會強制洗回題庫。</p>
        <button class="big-btn" onclick="startGame()">開始戰鬥</button>
    </div>

    <div id="quiz-area" style="display: none;">
        <div class="status-bar">
            <span id="progress">第 1 / 10 題</span>
            <span id="remaining">累積錯題: 0</span>
        </div>
        
        <div class="question-area">
            <div class="sentence" id="sentence-display">題目載入中...</div>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div class="explanation-box" id="explanation">
            <div class="exp-title">解析</div>
            <div class="exp-translation" id="translation-text"></div>
            <div class="exp-detail" id="reason-text"></div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
    </div>

    <div id="end-screen" style="display: none;">
        <h1>特訓結束</h1>
        <div id="result-stats"></div>
        <button class="big-btn" onclick="location.reload()">再來一回</button>
    </div>
</div>

<script>
    // Database with 3 sentences per word
    const fullDb = [
        // --- Group 1: 大/長 複合詞 ---
        {
            word: "大掃除",
            sentences: [
                "年末なので、家族全員で____を始めた。",
                "引越しをする前に、部屋の____をしなければならない。",
                "春になったので、冬物を片付けるついでに____をした。"
            ],
            options: ["大掃除", "大騒ぎ", "大違い", "大人数"],
            translation: "(例句隨機) 大意：進行大掃除。",
            detail: "「おおそうじ（大掃除）」是徹底打掃的意思，常搭配年末、搬家等情境。"
        },
        {
            word: "大騒ぎ",
            sentences: [
                "店の中で客が喧嘩を始めて、____になった。",
                "有名なアイドルが来て、駅前は____になった。",
                "些細なことで____をするのはやめてください。"
            ],
            options: ["大騒ぎ", "大掃除", "大通り", "長電話"],
            translation: "(例句隨機) 大意：引起大騷動/大吵大鬧。",
            detail: "「おおさわぎ（大騒ぎ）」指騷動、喧鬧、小題大作。"
        },
        {
            word: "大違い",
            sentences: [
                "双子だが、性格は____だ。",
                "自分で見るのと写真で見るのとでは、印象が____だ。",
                "簡単だと思っていたが、やってみたら____だった。"
            ],
            options: ["大違い", "大掃除", "大騒ぎ", "大げさ"],
            translation: "(例句隨機) 大意：大相徑庭/完全不同/搞錯了。",
            detail: "「おおちがい（大違い）」指非常不同、或是與預期相差甚遠。"
        },
        {
            word: "大人数",
            sentences: [
                "パーティーには____のゲストが参加した。",
                "このゲームは____で遊んだほうが楽しい。",
                "____の予約なので、早めに店に連絡した。"
            ],
            options: ["大人数", "大掃除", "大通り", "長時間"],
            translation: "(例句隨機) 大意：很多人數。",
            detail: "「おおにんずう（大人数）」指人數眾多。"
        },
        {
            word: "長旅",
            sentences: [
                "一週間の____から帰ってきて、とても疲れた。",
                "バスでの____は、腰が痛くなる。",
                "これから始まる____に備えて、ゆっくり休んだ。"
            ],
            options: ["長旅", "長距離", "長電話", "長期間"],
            translation: "(例句隨機) 大意：長途旅行。",
            detail: "「ながたび（長旅）」指長時間、長距離的旅程。"
        },
        {
            word: "長電話",
            sentences: [
                "母は友達と____をするのが好きだ。",
                "昨夜、彼女と____をしてしまって寝不足だ。",
                "仕事中の____は控えてください。"
            ],
            options: ["長電話", "長旅", "長距離", "長時間"],
            translation: "(例句隨機) 大意：長時間講電話。",
            detail: "「ながでんわ（長電話）」指通話時間很長。"
        },
        {
            word: "長距離",
            sentences: [
                "彼は____トラックの運転手をしている。",
                "____恋愛は続けるのが難しいと言う人もいる。",
                "駅伝で____を走る選手たちを応援した。"
            ],
            options: ["長距離", "長時間", "長期間", "長旅"],
            translation: "(例句隨機) 大意：長距離。",
            detail: "「ちょうきょり（長距離）」指物理距離很長。"
        },
        {
            word: "長期間",
            sentences: [
                "この工事は____にわたって行われる予定だ。",
                "____海外に滞在するにはビザが必要だ。",
                "野菜を____保存する方法を調べた。"
            ],
            options: ["長期間", "長時間", "長距離", "長旅"],
            translation: "(例句隨機) 大意：長期間(日子)。",
            detail: "「ちょうきかん（長期間）」強調「日期、歲月」的長度。"
        },
        {
            word: "長時間",
            sentences: [
                "____パソコンを使うと、目が疲れる。",
                "飛行機で____座っていたので足がむくんだ。",
                "このバッテリーは____使用しても大丈夫だ。"
            ],
            options: ["長時間", "長期間", "長距離", "長旅"],
            translation: "(例句隨機) 大意：長時間(小時)。",
            detail: "「ちょうじかん（長時間）」通常指連續的幾個小時。"
        },

        // --- Group 2: 一般副詞 ---
        {
            word: "とうとう",
            sentences: [
                "長い間待っていたが、彼は____来なかった。",
                "使っていたパソコンが、____壊れてしまった。",
                "恐れていた事態が、____起きてしまった。"
            ],
            options: ["とうとう", "そろそろ", "だんだん", "ますます"],
            translation: "(例句隨機) 大意：終於(導致了某結果，多負面)。",
            detail: "「とうとう」表示到了最後的結果，常用於壞的結果（終於...還是沒...）。"
        },
        {
            word: "ようやく",
            sentences: [
                "3年かかって、____N1に合格した。",
                "春が来て、____暖かくなってきた。",
                "混雑していた道が、____空いてきた。"
            ],
            options: ["ようやく", "とうとう", "あくまで", "しきゅう"],
            translation: "(例句隨機) 大意：終於(期待的好結果)。",
            detail: "「ようやく」表示經過長時間努力或等待，終於達成期待的結果（好事/變化）。"
        },
        {
            word: "結局",
            sentences: [
                "色々議論したが、____何も決まらなかった。",
                "薬を飲んだが、____風邪は治らなかった。",
                "高いチケットを買ったが、____行けなかった。"
            ],
            options: ["結局", "至急", "単に", "半ば"],
            translation: "(例句隨機) 大意：結果、到頭來。",
            detail: "「けっきょく（結局）」接在最後，表示結論。"
        },
        {
            word: "思わず",
            sentences: [
                "痛くて、____大声を出してしまった。",
                "彼の冗談に、____吹き出して笑ってしまった。",
                "転びそうになって、____隣の人をつかんだ。"
            ],
            options: ["思わず", "思い切って", "相変わらず", "思いがけず"],
            translation: "(例句隨機) 大意：不由得、下意識地。",
            detail: "「おもわず」指沒有經過思考、下意識地、不由得做出的反應。"
        },
        {
            word: "つい",
            sentences: [
                "ダイエット中なのに、____甘いものを食べてしまった。",
                "忙しくて、____電話するのを忘れてしまった。",
                "彼の話が面白くて、____時間を忘れて話し込んだ。"
            ],
            options: ["つい", "ふと", "あくまで", "せいぜい"],
            translation: "(例句隨機) 大意：不小心、不知不覺。",
            detail: "【重點】「つい」表示「不小心、不知不覺」做了不該做的事，常搭配「てしまった」。"
        },
        {
            word: "ふと",
            sentences: [
                "窓の外を見ると、____高校時代のことを思い出した。",
                "帰り道で、____いいアイデアが浮かんだ。",
                "____時計を見ると、もう夜中の3時だった。"
            ],
            options: ["ふと", "つい", "単に", "突如"],
            translation: "(例句隨機) 大意：偶然、突然(無意識)。",
            detail: "【重點】「ふと」指無意識地、偶然地、突然發生的心理活動或動作。"
        },
        {
            word: "とりあえず",
            sentences: [
                "詳しくは後で話すが、____ビールで乾杯しよう。",
                "結果はまだわからないが、____書類は提出した。",
                "注文が決まらないなら、____サラダでも頼もう。"
            ],
            options: ["とりあえず", "あくまで", "せいぜい", "まして"],
            translation: "(例句隨機) 大意：暫且、首先。",
            detail: "「とりあえず」指暫且、首先（不管其他的，先做眼前的事）。"
        },
        {
            word: "やむをえず",
            sentences: [
                "台風のため、旅行は____中止になった。",
                "熱が出たので、____仕事を休んだ。",
                "電車が止まったので、____タクシーで帰宅した。"
            ],
            options: ["やむをえず", "思わず", "あくまで", "単に"],
            translation: "(例句隨機) 大意：不得已、無可奈何。",
            detail: "【重點】「やむをえず」源自「止むを得ない」，意指「不得已、非自願地」。"
        },
        {
            word: "まして",
            sentences: [
                "大人の私でも重いのだから、____子供には持てない。",
                "彼は英語も話せない。____フランス語なんて無理だ。",
                "平日でも混んでいるのに、____休日はすごい人だろう。"
            ],
            options: ["まして", "あくまで", "せいぜい", "ほんの"],
            translation: "(例句隨機) 大意：更何況、更不用說。",
            detail: "「まして」意為「更何況」，常用於後句表示程度更甚。"
        },
        {
            word: "ほんの",
            sentences: [
                "これは____気持ちですが、どうぞ受け取ってください。",
                "____少しの油断が、大きな事故につながる。",
                "駅から家までは、____5分くらいの距離だ。"
            ],
            options: ["ほんの", "せいぜい", "もっぱら", "あくまで"],
            translation: "(例句隨機) 大意：僅僅、一點點。",
            detail: "「ほんの」接名詞，表示「僅僅」。常見「ほんの気持ち（一點心意）」。"
        },
        {
            word: "せいぜい",
            sentences: [
                "参加者は____50人ぐらいだろう。",
                "頑張っても、____80点くらいしか取れないと思う。",
                "休みは____3日しか取れない。"
            ],
            options: ["せいぜい", "あくまで", "単に", "突如"],
            translation: "(例句隨機) 大意：充其量、頂多。",
            detail: "【重點】「せいぜい」表示「極限、頂多」，通常帶有「不會更多了」的消極語氣。"
        },
        {
            word: "至急",
            sentences: [
                "この資料を____コピーしてください。",
                "社長が呼んでいます。____社長室へ来てください。",
                "担当者は____連絡をください。"
            ],
            options: ["至急", "結局", "単に", "徐々に"],
            translation: "(例句隨機) 大意：火速、十萬火急。",
            detail: "「しきゅう（至急）」是非常緊急的意思，比「急いで」更正式。"
        },
        {
            word: "突如",
            sentences: [
                "____、目の前に黒い猫が現れた。",
                "平和な村を、____地震が襲った。",
                "彼は____、会社を辞めると言い出した。"
            ],
            options: ["突如", "あくまで", "せいぜい", "半ば"],
            translation: "(例句隨機) 大意：突然。",
            detail: "【重點】「とつじょ（突如）」是「突然（いきなり）」的書面語。"
        },
        {
            word: "単に",
            sentences: [
                "それは____噂にすぎない。",
                "私は____事実を述べただけだ。",
                "彼が遅れたのは、____寝坊したからだ。"
            ],
            options: ["単に", "直に", "現に", "特に"],
            translation: "(例句隨機) 大意：僅僅、只不過。",
            detail: "「たんに（単に）」表示「僅僅、只不過」，常搭配「～にすぎない」。"
        },
        {
            word: "あくまで",
            sentences: [
                "会議で彼は____自分の意見を主張した。",
                "これは____私の個人的な意見です。",
                "決定権は____社長にある。"
            ],
            options: ["あくまで", "せいぜい", "とりあえず", "思わず"],
            translation: "(例句隨機) 大意：徹底、到底、終究。",
            detail: "「あくまで」表示「徹底、到底」。"
        },
        {
            word: "半ば",
            sentences: [
                "彼は酒に酔って、____ふざけて言った。",
                "彼女は____あきらめ顔でため息をついた。",
                "その工事は、まだ____しか終わっていない。"
            ],
            options: ["半ば", "単に", "突如", "至急"],
            translation: "(例句隨機) 大意：一半、半...",
            detail: "【重點】「なかば（半ば）」表示「一半」，如「冗談半ば（半開玩笑）」。"
        },

        // --- Group 3: 擬聲擬態詞 (重點加強) ---
        {
            word: "びっしり",
            sentences: [
                "ノートに漢字が____書いてある。",
                "手帳には今月の予定が____書き込まれている。",
                "壁にカビが____生えていてショックだった。"
            ],
            options: ["びっしり", "どっさり", "ひっそり", "すんなり"],
            translation: "(例句隨機) 大意：密密麻麻(平面無空隙)。",
            detail: "「びっしり」指「沒有空隙、密密麻麻」的樣子（通常指平面空間）。"
        },
        {
            word: "ぎっしり",
            sentences: [
                "箱にお菓子が____詰まっている。",
                "スーツケースに荷物を____詰め込んだ。",
                "本棚には専門書が____並んでいる。"
            ],
            options: ["ぎっしり", "びっしり", "ぐちゃぐちゃ", "すれすれ"],
            translation: "(例句隨機) 大意：擠得滿滿的(立體空間)。",
            detail: "「ぎっしり」指「塞得滿滿的」樣子（通常指立體容器）。"
        },
        {
            word: "くっきり",
            sentences: [
                "今日は天気がいいので、富士山が____見える。",
                "青空に白い雲が____浮かんでいる。",
                "テレビの映像が____映っている。"
            ],
            options: ["くっきり", "じっくり", "ぐったり", "きっぱり"],
            translation: "(例句隨機) 大意：輪廓清晰。",
            detail: "「くっきり」指「輪廓清晰、鮮明、對比強烈」。"
        },
        {
            word: "どっさり",
            sentences: [
                "田舎から野菜が____届いた。",
                "宿題が____出て、遊ぶ時間がない。",
                "郵便受けにチラシが____入っていた。"
            ],
            options: ["どっさり", "びっしり", "すれすれ", "ひっそり"],
            translation: "(例句隨機) 大意：大量、許多。",
            detail: "「どっさり」指「數量非常多、沉甸甸」的樣子。"
        },
        {
            word: "びっしょり",
            sentences: [
                "夕立にあって、服が____濡れてしまった。",
                "悪夢を見て、起きたら冷や汗を____かいていた。",
                "運動をして、シャツが____だ。"
            ],
            options: ["びっしょり", "しっとり", "きっぱり", "すんなり"],
            translation: "(例句隨機) 大意：濕透。",
            detail: "「びっしょり」指「濕透」的樣子（全身、大量汗水）。"

    let currentRoundQuestions = [];
    let currentQuestionIndex = 0;
    let wrongAnswerQueue = [];
    let isRoundFinished = false;

    // Helper: Shuffle Array
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        
        let pool = [];
        if (wrongAnswerQueue.length > 0) {
            pool = [...wrongAnswerQueue];
            wrongAnswerQueue = []; 
            if (pool.length < 10) {
                let fresh = shuffle([...fullDb]).filter(q => !pool.some(p => p.word === q.word));
                pool = pool.concat(fresh.slice(0, 10 - pool.length));
            }
        } else {
            pool = shuffle([...fullDb]).slice(0, 10);
        }
        
        currentRoundQuestions = shuffle(pool);
        currentQuestionIndex = 0;
        isRoundFinished = false;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentRoundQuestions.length) {
            finishRound();
            return;
        }

        const q = currentRoundQuestions[currentQuestionIndex];
        
        // Randomly select one of the 3 sentences
        const randomSentence = q.sentences[Math.floor(Math.random() * q.sentences.length)];
        
        // Update UI
        document.getElementById('progress').innerText = `第 ${currentQuestionIndex + 1} / ${currentRoundQuestions.length} 題`;
        document.getElementById('remaining').innerText = `本回錯題累積: ${wrongAnswerQueue.length}`;
        document.getElementById('sentence-display').innerText = randomSentence;
        
        // Reset Explanation
        document.getElementById('explanation').className = 'explanation-box';
        document.getElementById('next-btn').style.display = 'none';

        // Options
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Shuffle options for display
        let displayOptions = shuffle([...q.options]);
        
        displayOptions.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected, questionData) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const isCorrect = selected === questionData.word;

        if (isCorrect) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.innerText === questionData.word) b.classList.add('correct');
            });
            wrongAnswerQueue.push(questionData);
        }

        document.getElementById('translation-text').innerText = questionData.translation;
        document.getElementById('reason-text').innerText = questionData.detail;
        document.getElementById('explanation').className = 'explanation-box show';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function finishRound() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        
        const resultDiv = document.getElementById('result-stats');
        if (wrongAnswerQueue.length === 0) {
            resultDiv.innerHTML = `<h2 style="color:var(--correct)">太棒了！本回全對！</h2><p>可以挑戰下一回，或休息一下。</p>`;
        } else {
            resultDiv.innerHTML = `<h2 style="color:var(--wrong)">本回有 ${wrongAnswerQueue.length} 題需要複習</h2><p>點擊「再來一回」將優先出現這些錯題。</p>`;
        }
    }
