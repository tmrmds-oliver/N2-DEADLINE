<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT N2 副詞地獄特訓 (完美解析版)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #d35400;
            --correct: #27ae60;
            --wrong: #c0392b;
            --bg: #f5f6fa;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
        }
        h1 { text-align: center; color: var(--primary); font-size: 1.5rem; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .question-area { margin-bottom: 25px; }
        .sentence {
            font-size: 1.3rem;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 20px;
            background: #ecf0f1;
            padding: 25px;
            border-radius: 8px;
            border-left: 6px solid var(--accent);
            min-height: 80px;
            display: flex;
            align-items: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .option-btn {
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .option-btn:hover { background: #f0f0f0; border-color: var(--primary); }
        .option-btn.correct { background: #d5f5e3; border-color: var(--correct); color: var(--correct); font-weight: bold; }
        .option-btn.wrong { background: #fadbd8; border-color: var(--wrong); color: var(--wrong); opacity: 0.7; }
        
        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fdfefe;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
        }
        .explanation-box.show { display: block; animation: fadeIn 0.4s; }
        
        .exp-section { margin-bottom: 15px; }
        .exp-label { 
            font-size: 0.85rem; 
            color: #7f8c8d; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .exp-content { 
            font-size: 1.05rem; 
            color: #2c3e50; 
            line-height: 1.5;
            font-weight: 500;
        }
        .exp-detail-text {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
        }

        .next-btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .next-btn:hover { background: #34495e; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Start & End Screen */
        #start-screen, #end-screen { text-align: center; padding: 40px 0; }
        .big-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a04000;
            margin-top: 20px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .big-btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>JLPT N2 副詞・擬聲擬態詞<br>完美解析版</h1>
        <p>題庫特色：</p>
        <ul style="text-align: left; display: inline-block; color:#555;">
            <li>每字 3 句隨機輪換，杜絕死記硬背</li>
            <li><strong>解析包含該句完整翻譯</strong> + 單字重點用法</li>
            <li>錯題強制輪迴機制</li>
        </ul>
        <br>
        <button class="big-btn" onclick="startGame()">開始特訓</button>
    </div>

    <div id="quiz-area" style="display: none;">
        <div class="status-bar">
            <span id="progress">第 1 / 10 題</span>
            <span id="remaining">累積錯題: 0</span>
        </div>
        
        <div class="question-area">
            <div class="sentence" id="sentence-display">題目載入中...</div>
        </div>

        <div class="options-grid" id="options-container">
            </div>

        <div class="explanation-box" id="explanation">
            <div class="exp-section">
                <span class="exp-label">本句翻譯</span>
                <div class="exp-content" id="translation-text" style="color: var(--accent);"></div>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <div class="exp-section">
                <span class="exp-label">單字解析</span>
                <div class="exp-detail-text" id="reason-text"></div>
            </div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
    </div>

    <div id="end-screen" style="display: none;">
        <h1>特訓結束</h1>
        <div id="result-stats"></div>
        <button class="big-btn" onclick="location.reload()">再來一回</button>
    </div>
</div>

<script>
    /**
     * Data Structure:
     * word: Target Answer
     * pairs: Array of {q: Question Sentence, t: Full Translation}
     * options: Distractor options
     * detail: General explanation of the word nuance
     */
    const fullDb = [
        // --- Group 1: 大/長 複合詞 ---
        {
            word: "大掃除",
            pairs: [
                {q: "年末なので、家族全員で____を始めた。", t: "因為是年底，所以全家人開始了大掃除。"},
                {q: "引越しをする前に、部屋の____をしなければならない。", t: "在搬家之前，必須對房間進行大掃除。"},
                {q: "春になったので、冬物を片付けるついでに____をした。", t: "到了春天，整理冬衣的時候順便做了大掃除。"}
            ],
            options: ["大掃除", "大騒ぎ", "大違い", "大人数"],
            detail: "「おおそうじ（大掃除）」是徹底打掃的意思，常搭配年末、搬家等情境。"
        },
        {
            word: "大騒ぎ",
            pairs: [
                {q: "店の中で客が喧嘩を始めて、____になった。", t: "客人在店裡開始吵架，引起了一陣大騷動。"},
                {q: "有名なアイドルが来て、駅前は____になった。", t: "有名的偶像來了，車站前引起了大騷動。"},
                {q: "些細なことで____をするのはやめてください。", t: "請不要為了瑣碎的小事大吵大鬧（引起騷動）。"}
            ],
            options: ["大騒ぎ", "大掃除", "大通り", "長電話"],
            detail: "「おおさわぎ（大騒ぎ）」指騷動、喧鬧、引起混亂。"
        },
        {
            word: "大違い",
            pairs: [
                {q: "双子だが、性格は____だ。", t: "雖然是雙胞胎，但性格卻天差地遠（大不相同）。"},
                {q: "自分で見るのと写真で見るのとでは、印象が____だ。", t: "親眼看到和看照片，印象完全不同。"},
                {q: "簡単だと思っていたが、やってみたら____だった。", t: "原本以為很簡單，實際做起來卻完全不是那麼一回事（大錯特錯）。"}
            ],
            options: ["大違い", "大掃除", "大騒ぎ", "大げさ"],
            detail: "「おおちがい（大違い）」指非常不同、或是與預期相差甚遠。"
        },
        {
            word: "大人数",
            pairs: [
                {q: "パーティーには____のゲストが参加した。", t: "有很多客人參加了派對。"},
                {q: "このゲームは____で遊んだほうが楽しい。", t: "這個遊戲多人一起玩會比較好玩。"},
                {q: "____の予約なので、早めに店に連絡した。", t: "因為是多人的預約，所以提早聯絡了店家。"}
            ],
            options: ["大人数", "大掃除", "大通り", "長時間"],
            detail: "「おおにんずう（大人数）」指人數眾多。"
        },
        {
            word: "長旅",
            pairs: [
                {q: "一週間の____から帰ってきて、とても疲れた。", t: "從為期一週的長途旅行回來，非常累。"},
                {q: "バスでの____は、腰が痛くなる。", t: "搭巴士的長途旅行會讓腰很痛。"},
                {q: "これから始まる____に備えて、ゆっくり休んだ。", t: "為了準備即將開始的長途旅行，好好休息了。"}
            ],
            options: ["長旅", "長距離", "長電話", "長期間"],
            detail: "「ながたび（長旅）」指長時間、長距離的旅程。"
        },
        {
            word: "長電話",
            pairs: [
                {q: "母は友達と____をするのが好きだ。", t: "媽媽喜歡和朋友講很久的電話。"},
                {q: "昨夜、彼女と____をしてしまって寝不足だ。", t: "昨晚和女朋友講電話講太久，導致睡眠不足。"},
                {q: "仕事中の____は控えてください。", t: "請盡量避免在工作中長時間通電話。"}
            ],
            options: ["長電話", "長旅", "長距離", "長時間"],
            detail: "「ながでんわ（長電話）」指通話時間很長。"
        },
        {
            word: "長距離",
            pairs: [
                {q: "彼は____トラックの運転手をしている。", t: "他是長途卡車的司機。"},
                {q: "____恋愛は続けるのが難しいと言う人もいる。", t: "也有人說遠距離戀愛很難維持。"},
                {q: "駅伝で____を走る選手たちを応援した。", t: "為驛站接力賽中跑長距離區間的選手們加油。"}
            ],
            options: ["長距離", "長時間", "長期間", "長旅"],
            detail: "「ちょうきょり（長距離）」指物理距離很長。"
        },
        {
            word: "長期間",
            pairs: [
                {q: "この工事は____にわたって行われる予定だ。", t: "這個工程預計將持續很長一段時間。"},
                {q: "____海外に滞在するにはビザが必要だ。", t: "要長期在海外停留需要簽證。"},
                {q: "野菜を____保存する方法を調べた。", t: "查詢了長期保存蔬菜的方法。"}
            ],
            options: ["長期間", "長時間", "長距離", "長旅"],
            detail: "「ちょうきかん（長期間）」強調「日期、歲月」的長度。"
        },
        {
            word: "長時間",
            pairs: [
                {q: "____パソコンを使うと、目が疲れる。", t: "長時間使用電腦的話，眼睛會疲勞。"},
                {q: "飛行機で____座っていたので足がむくんだ。", t: "因為在飛機上坐了很長時間，腳水腫了。"},
                {q: "このバッテリーは____使用しても大丈夫だ。", t: "這個電池即使長時間使用也沒問題。"}
            ],
            options: ["長時間", "長期間", "長距離", "長旅"],
            detail: "「ちょうじかん（長時間）」通常指連續的幾個小時。"
        },

        // --- Group 2: 一般副詞 ---
        {
            word: "とうとう",
            pairs: [
                {q: "長い間待っていたが、彼は____来なかった。", t: "等了很久，但他終究沒有來。"},
                {q: "使っていたパソコンが、____壊れてしまった。", t: "在用的電腦終於還是壞掉了。"},
                {q: "恐れていた事態が、____起きてしまった。", t: "擔心的事態終於還是發生了。"}
            ],
            options: ["とうとう", "そろそろ", "だんだん", "ますます"],
            detail: "「とうとう」表示到了最後的結果，常用於壞的結果（終於...還是沒...）。"
        },
        {
            word: "ようやく",
            pairs: [
                {q: "3年かかって、____N1に合格した。", t: "花了三年，終於合格了N1。"},
                {q: "春が来て、____暖かくなってきた。", t: "春天來了，終於變暖和了。"},
                {q: "混雑していた道が、____空いてきた。", t: "塞車的道路終於變空曠了。"}
            ],
            options: ["ようやく", "とうとう", "あくまで", "しきゅう"],
            detail: "「ようやく」表示經過長時間努力或等待，終於達成期待的結果（好事/變化）。"
        },
        {
            word: "結局",
            pairs: [
                {q: "色々議論したが、____何も決まらなかった。", t: "討論了很久，結果什麼都沒決定。"},
                {q: "薬を飲んだが、____風邪は治らなかった。", t: "雖然吃了藥，結果感冒還是沒好。"},
                {q: "高いチケットを買ったが、____行けなかった。", t: "雖然買了很貴的票，結果還是沒能去成。"}
            ],
            options: ["結局", "至急", "単に", "半ば"],
            detail: "「けっきょく（結局）」接在最後，表示結論。"
        },
        {
            word: "思わず",
            pairs: [
                {q: "痛くて、____大声を出してしまった。", t: "太痛了，不由得叫了一聲。"},
                {q: "彼の冗談に、____吹き出して笑ってしまった。", t: "聽到他的笑話，忍不住噴笑了出來。"},
                {q: "転びそうになって、____隣の人をつかんだ。", t: "差點跌倒，下意識地抓住了旁邊的人。"}
            ],
            options: ["思わず", "思い切って", "相変わらず", "思いがけず"],
            detail: "「おもわず」指沒有經過思考、下意識地、不由得做出的反應。"
        },
        {
            word: "つい",
            pairs: [
                {q: "ダイエット中なのに、____甘いものを食べてしまった。", t: "明明在減肥，卻不小心吃了甜食。"},
                {q: "忙しくて、____電話するのを忘れてしまった。", t: "因為太忙，不知不覺就忘了打電話。"},
                {q: "彼の話が面白くて、____時間を忘れて話し込んだ。", t: "因為他的話很有趣，不知不覺忘了時間聊了起來。"}
            ],
            options: ["つい", "ふと", "あくまで", "せいぜい"],
            detail: "【重點】「つい」表示「不小心、不知不覺」做了不該做的事，常搭配「てしまった」。"
        },
        {
            word: "ふと",
            pairs: [
                {q: "窓の外を見ると、____高校時代のことを思い出した。", t: "看著窗外，突然（無意間）想起了高中時代的事。"},
                {q: "帰り道で、____いいアイデアが浮かんだ。", t: "在回家的路上，忽然想到了一個好點子。"},
                {q: "____時計を見ると、もう夜中の3時だった。", t: "猛然一看時鐘，已經是半夜三點了。"}
            ],
            options: ["ふと", "つい", "単に", "突如"],
            detail: "【重點】「ふと」指無意識地、偶然地、突然發生的心理活動或動作。"
        },
        {
            word: "とりあえず",
            pairs: [
                {q: "詳しくは後で話すが、____ビールで乾杯しよう。", t: "詳情稍後再說，總之先乾杯喝啤酒吧。"},
                {q: "結果はまだわからないが、____書類は提出した。", t: "雖然還不知道結果，但總之先把文件交出去了。"},

            ],
            options: ["とりあえず", "あくまで", "せいぜい", "まして"],
            detail: "「とりあえず」指暫且、首先（不管其他的，先做眼前的事）。"
        },
        {
            word: "やむをえず",
            pairs: [
                {q: "台風のため、旅行は____中止になった。", t: "因為颱風，旅行不得不中止了。"},
                {q: "熱が出たので、____仕事を休んだ。", t: "因為發燒了，不得已只好請假。"},

            options: ["やむをえず", "思わず", "あくまで", "単に"],

            pairs: [

        {
            word: "ほんの",

        {

            options: ["せいぜい", "あくまで", "単に", "突如"],

        },
        {
            word: "至急",
            pairs: [
                {q: "この資料を____コピーしてください。", t: "請火速（盡快）影印這份資料。"},
                {q: "社長が呼んでいます。____社長室へ来てください。", t: "社長在找你，請火速到社長室。"},

            detail: "「しきゅう（至急）」是非常緊急的意思，比「急いで」更正式。"
        },
        {
            word: "突如",
            pairs: [
                {q: "____、目の前に黒い猫が現れた。", t: "突然，眼前出現了一隻黑貓。"},
                {q: "平和な村を、____地震が襲った。", t: "地震突然襲擊了和平的村莊。"},
                {q: "彼は____、会社を辞めると言い出した。", t: "他突然說要辭職。"}

                {q: "彼は些細なことで____悩むタイプだ。", t: "他是那種會為了瑣碎小事鑽牛角尖的類型。"}
            ],
            options: ["くよくよ", "シクシク", "ブツブツ", "イライラ"],
            detail: "「くよくよ」指「垂頭喪氣、想不開、鑽牛角尖」。"
        },
        {
            word: "にやにや",
            pairs: [
                {q: "何を思い出しているのか、彼は一人で____している。", t: "不知想起了什麼，他一個人不懷好意地（或傻傻地）笑著。"},
                {q: "人の失敗を見て____するのは失礼だ。", t: "看到別人的失敗在旁邊偷笑是很失禮的。"},
                {q: "漫画を読みながら____笑っている。", t: "邊看漫畫邊竊笑。"}
            ],
            options: ["にやにや", "ニコニコ", "ゲラゲラ", "ニタニタ"],
            detail: "「にやにや」指「嗤笑、竊笑、令人不舒服的笑」。"
        },
        {
            word: "ひやひや",
            pairs: [
                {q: "子供が木に登っているのを見て、____した。", t: "看到小孩爬樹，讓人提心吊膽。"},
                {q: "運転が荒くて、助手席で____した。", t: "因為開車很猛，在副駕駛座上提心吊膽。"},
                {q: "締め切りに間に合うか____した。", t: "很擔心能不能趕上截稿，捏了一把冷汗。"}
            ],
            options: ["ひやひや", "ハラハラ", "ドキドキ", "ブルブル"],
            detail: "「ひやひや」指「提心吊膽（覺得危險而感到寒意）」。"
        },
        {
            word: "ぐったり",
            pairs: [
                {q: "熱が出て、ベッドで____している。", t: "發燒了，在床上癱軟無力。"},
                {q: "残業続きで、家に帰ると____だ。", t: "連續加班，一回到家就累癱了。"},
                {q: "植物が水不足で____している。", t: "植物因為缺水而枯萎下垂。"}
            ],
            options: ["ぐったり", "くたくた", "ごロゴロ", "うとうと"],
            detail: "「ぐったり」指「精疲力盡到癱軟（生病或極度勞累）」。"
        },
        {
            word: "くたくた",
            pairs: [
                {q: "一日中歩いて、もう____だ。", t: "走了一整天，已經筋疲力盡了。"},
                {q: "煮込みすぎて、野菜が____になった。", t: "煮太久了，蔬菜變得爛爛的。"},
                {q: "激しい運動をして、体中が____だ。", t: "做了劇烈運動，全身筋疲力盡。"}
            ],
            options: ["くたくた", "ぐったり", "ふわふわ", "カラカラ"],
            detail: "「くたくた」指「累壞了」或「煮得軟爛、衣物磨損變舊」。"
        },
        {
            word: "へとへと",
            pairs: [
                {q: "残業続きで、体も心も____だ。", t: "連續加班，身心俱疲。"},
                {q: "ゴールした時、選手たちは____だった。", t: "到達終點時，選手們都累得動彈不得。"},
                {q: "空腹と疲労で____になって倒れ込んだ。", t: "因為飢餓和疲勞，累到癱倒在地。"}
            ],
            options: ["へとへと", "くたくた", "ボロボロ", "ギリギリ"],
            detail: "「へとへと」指「累得動彈不得、一點力氣都沒有」。"
        }
    ];

    let currentRoundQuestions = [];
    let currentQuestionIndex = 0;
    let wrongAnswerQueue = [];
    let isRoundFinished = false;
    let currentSelectedPair = null; // Store currently displayed pair

    // Helper: Shuffle Array
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        
        let pool = [];
        if (wrongAnswerQueue.length > 0) {
            pool = [...wrongAnswerQueue];
            wrongAnswerQueue = []; 
            if (pool.length < 10) {
                let fresh = shuffle([...fullDb]).filter(q => !pool.some(p => p.word === q.word));
                pool = pool.concat(fresh.slice(0, 10 - pool.length));
            }
        } else {
            pool = shuffle([...fullDb]).slice(0, 10);
        }
        
        currentRoundQuestions = shuffle(pool);
        currentQuestionIndex = 0;
        isRoundFinished = false;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentRoundQuestions.length) {
            finishRound();
            return;
        }

        const q = currentRoundQuestions[currentQuestionIndex];
        
        // Randomly select one pair (Question + Translation)
        currentSelectedPair = q.pairs[Math.floor(Math.random() * q.pairs.length)];
        
        // Update UI
        document.getElementById('progress').innerText = `第 ${currentQuestionIndex + 1} / ${currentRoundQuestions.length} 題`;
        document.getElementById('remaining').innerText = `本回錯題累積: ${wrongAnswerQueue.length}`;
        document.getElementById('sentence-display').innerText = currentSelectedPair.q;
        
        // Reset Explanation
        document.getElementById('explanation').className = 'explanation-box';
        document.getElementById('next-btn').style.display = 'none';

        // Options
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        // Shuffle options for display
        let displayOptions = shuffle([...q.options]);
        
        displayOptions.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt, q);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, selected, questionData) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const isCorrect = selected === questionData.word;

        if (isCorrect) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.innerText === questionData.word) b.classList.add('correct');
            });
            wrongAnswerQueue.push(questionData);
        }

        // Display EXACT translation for the random sentence shown
        document.getElementById('translation-text').innerText = currentSelectedPair.t;
        // Display General Nuance Detail
        document.getElementById('reason-text').innerText = questionData.detail;
        
        document.getElementById('explanation').className = 'explanation-box show';
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadQuestion();
    }

    function finishRound() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        
        const resultDiv = document.getElementById('result-stats');
        if (wrongAnswerQueue.length === 0) {
            resultDiv.innerHTML = `<h2 style="color:var(--correct)">太棒了！本回全對！</h2><p>可以挑戰下一回，或休息一下。</p>`;
        } else {
            resultDiv.innerHTML = `<h2 style="color:var(--wrong)">本回有 ${wrongAnswerQueue.length} 題需要複習</h2><p>點擊「再來一回」將優先出現這些錯題。</p>`;
        }
    }

</script>
