<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLPT 地獄特訓</title>
    <style>
        :root {
            --primary: #881337; /* Rose 900 - 血紅 */
            --primary-hover: #be123c;
            --success: #15803d; /* Green 700 */
            --error: #b91c1c; /* Red 700 */
            --bg: #020617; /* Slate 950 - 極黑 */
            --card: #0f172a; /* Slate 900 */
            --text-main: #e2e8f0;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Hiragino Sans', 'Meiryo', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            background-color: var(--card);
            width: 100%;
            max-width: 700px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(225, 29, 72, 0.1);
            padding: 35px;
            position: relative;
            border: 1px solid #1e293b;
        }

        h1 {
            color: #f43f5e;
            font-size: 2rem;
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* 進度條 */
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 99px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #e11d48;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 15px #e11d48;
        }

        /* 題目卡片 */
        .quiz-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .tag {
            background: #4c0519;
            color: #fda4af;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid #9f1239;
            letter-spacing: 1px;
        }

        .word-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #f1f5f9;
            margin: 15px 0;
            letter-spacing: 0.05em;
        }

        /* 選項網格 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .word-text { font-size: 2.8rem; }
            .container { padding: 20px; }
        }

        button.opt-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 65px;
        }

        button.opt-btn:hover:not(:disabled) {
            border-color: #f43f5e;
            background: #4c0519;
            color: #fff;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        button.opt-btn.correct {
            background: #064e3b;
            color: #4ade80;
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        button.opt-btn.wrong {
            background: #450a0a;
            color: #fca5a5;
            border-color: #ef4444;
            opacity: 0.5;
            text-decoration: line-through;
        }

        .feedback-area {
            min-height: 30px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fb7185;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #be123c;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(190, 18, 60, 0.4);
            margin-top: 20px;
        }
        .btn-primary:hover { 
            background: #e11d48;
            transform: translateY(-2px);
        }

        .hidden { display: none !important; }
    </style>
</head>

        while (distractors.size < 3 && attempts < 100) {
            attempts++;
            let fake = correctKana;
            const strategy = Math.floor(Math.random() * 8);

            // 1. 清濁音反轉
            if (strategy === 0) {
                fake = fake.replace(/[かきくけこ]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // ka -> ga
                           .replace(/[がぎぐげご]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)) // ga -> ka
                           .replace(/[たちつてと]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // ta -> da
                           .replace(/[だぢづでど]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)) // da -> ta
                           .replace(/[さしすせそ]/g, m => String.fromCharCode(m.charCodeAt(0) + 1)) // sa -> za
                           .replace(/[ざじずぜぞ]/g, m => String.fromCharCode(m.charCodeAt(0) - 1)); // za -> sa
            }
            // 2. 長音地獄
            else if (strategy === 1) {
                if (fake.includes('う')) fake = fake.replace('う', ''); // 移除長音
                else if (fake.match(/[おこぞとどのもろよ]/)) fake += 'う'; // 添加o段長音
                else if (fake.match(/[えけせてねめれ]/)) fake += 'い'; // 添加e段長音
                else if (fake.match(/[あかさたなはまやらわ]/)) fake += 'あ'; // 添加a段長音
            }
            // 3. 促音陷阱
            else if (strategy === 2) {
                if (fake.includes('っ')) fake = fake.replace('っ', 'つ'); // 移除促音
                else if (fake.includes('っ') === false && fake.length > 2) {
                    const pos = 1; 
                    fake = fake.slice(0, pos) + 'っ' + fake.slice(pos);
                }
            }
            // 4. 自動詞/他動詞混淆 (模擬)
            else if (strategy === 3) {
                if (fake.endsWith('かる')) fake = fake.replace('かる', 'ける');
                else if (fake.endsWith('ける')) fake = fake.replace('ける', 'かる');
                else if (fake.endsWith('ある')) fake = fake.replace('ある', 'える');
                else if (fake.endsWith('える')) fake = fake.replace('える', 'ある');
                else if (fake.endsWith('む')) fake = fake.replace('む', 'める');
                else if (fake.endsWith('つ')) fake = fake.replace('つ', 'てる');
            }
            // 5. 拗音消失/產生
            else if (strategy === 4) {
                 if (fake.includes('ゃ')) fake = fake.replace('ゃ', '');
                 else if (fake.includes('ゅ')) fake = fake.replace('ゅ', '');
                 else if (fake.includes('ょ')) fake = fake.replace('ょ', '');
                 else if (fake.includes('き')) fake = fake.replace('き', 'きょ');
                 else if (fake.includes('し')) fake = fake.replace('し', 'しゃ');
                 else if (fake.includes('ち')) fake = fake.replace('ち', 'ちゃ');
            }
            // 6. 尾音變化
            else if (strategy === 5) {
                const endings = ['い', 'く', 'つ', 'る', 'む'];
                fake = fake.slice(0, -1) + endings[Math.floor(Math.random() * endings.length)];
            }
            // 7. 音讀/訓讀混淆 (模擬)
            else if (strategy === 6) {
                if (fake.startsWith('お')) fake = fake.replace('お', 'ご');
                else if (fake.startsWith('ご')) fake = fake.replace('ご', 'お');
                else if (fake.startsWith('き')) fake = fake.replace('き', 'け'); 
            }
            // 8. 隨機微調
            else {
                 if (fake.includes('い')) fake = fake.replace('い', 'え');
                 else if (fake.includes('え')) fake = fake.replace('え', 'い');
            }

            // 確保干擾項不等於正確答案
            if (fake !== correctKana && fake.length >= 1 && fake !== 'undefined') {
                distractors.add(fake);
            }
        }
        return Array.from(distractors);
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // ============================================
    // 測驗流程
    // ============================================
    function startQuiz() {
        const shuffledWords = shuffle([...rawData]).slice(0, TARGET_QUESTIONS);
        
        quizQueue = shuffledWords.map(word => {
            let options = [];
            
            // 1. 手動 Traps 優先
            if (word.traps && word.traps.length > 0) {
                options = [...word.traps];
            }
            
            // 2. 演算法補足
            const generated = generateEvilDistractors(word.kana);
            for (let g of generated) {
                if (options.length >= 3) break;
                if (!options.includes(g)) options.push(g);
            }
            
            // 3. 資料庫隨機發音相似
            while (options.length < 3) {
                const randomWord = rawData[Math.floor(Math.random() * rawData.length)];
                if (randomWord.kana !== word.kana && !options.includes(randomWord.kana)) {
                    options.push(randomWord.kana);
                }
            }
            
            options.push(word.kana);
            options = shuffle(options);

            return {
                text: word.kanji,
                correct: word.kana,
                options: options,
                raw: word
            };
        });

        wrongCount = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        if (quizQueue.length === 0) {
            showResult();
            return;
        }

        const q = quizQueue[0];
        const remaining = quizQueue.length;
        const progress = TARGET_QUESTIONS - remaining;
        const percentage = Math.min((progress / TARGET_QUESTIONS) * 100, 100);

        document.getElementById('progress-text').innerText = `已完成: ${progress} / ${TARGET_QUESTIONS}`;
        document.getElementById('queue-text').innerText = `剩餘: ${remaining}`;
        document.getElementById('progress-fill').style.width = `${percentage}%`;

        document.getElementById('q-word').innerText = q.text;
        document.getElementById('feedback-msg').innerText = '';

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(btn, opt, q);
            container.appendChild(btn);
        });
    }

    function handleAnswer(btn, selected, q) {
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selected === q.correct) {
            // 答對邏輯
            btn.classList.add('correct');
            document.getElementById('feedback-msg').style.color = '#4ade80';
            document.getElementById('feedback-msg').innerText = '正解！ ⭕';
            
            setTimeout(() => {
                // 核心邏輯：答對則永久移除 (shift)
                quizQueue.shift();
                renderQuestion();
            }, 800);
        } else {
            // 答錯邏輯
            btn.classList.add('wrong');
            wrongCount++;
            
            allBtns.forEach(b => {
                if (b.innerText === q.correct) b.classList.add('correct');
            });

            document.getElementById('feedback-msg').style.color = '#ef4444';
            document.getElementById('feedback-msg').innerText = `錯誤！ (${q.text} = ${q.correct})`;

            // 核心邏輯：答錯則重新排入隊列 (shift then push)
            const retryQ = quizQueue.shift();
            // 選項重新洗牌，避免背位置
            retryQ.options = shuffle(retryQ.options);
            quizQueue.push(retryQ);

            setTimeout(() => {
                renderQuestion();
            }, 2500);
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-stats').innerHTML = 
            `本次死亡次數：${wrongCount} 次`;
    }
</script>
